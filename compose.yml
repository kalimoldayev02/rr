services:
  app:
    build:
      dockerfile: local.Dockerfile
    working_dir: /app
    user: "1000"
    environment:
      TZ: Asia/Almaty
      APP_ENV: local
      DEBUG: true

      LOG_SOCKET_HOST: buggregator:9913

      VAR_DUMPER_FORMAT: server
      VAR_DUMPER_SERVER: buggregator:9912
    ports:
      - 80:80
    volumes:
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: curl http://127.0.0.1:2114/health?plugin=http
      interval: 10s
      timeout: 5s
      retries: 2
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}
      interval: 10s
      timeout: 5s
      retries: 5

  buggregator:
    image: ghcr.io/buggregator/server:latest
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  cache:
    image: redis:latest
    ports:
      - "6379:6379"

  docs:
    image: swaggerapi/swagger-ui
    environment:
      BASE_URL: /docs
      CORS: false
      SWAGGER_JSON_URL: http://localhost/docs
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  db-data:
    driver: local
